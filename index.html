<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#184F5F"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Nakuna Usuarios">
<title>Fundación Nakuna · Usuarios</title><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./favicon.svg">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{--b:#184f5f;--b2:#2a7380;--bd:#123f4c;--a:#e6a12b;--bg:#f4f7f6;--card:#fff;--line:#d9e4e3;--mut:#6d7f84;--ink:#173944;--shadow:0 8px 24px rgba(24,79,95,.09);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#fbfcfb,var(--bg));color:var(--ink)}button,input,select{font:inherit}.shell{min-height:100vh;padding-bottom:92px}.top{position:sticky;top:0;z-index:10;background:#fffffff2;backdrop-filter:blur(15px);border-bottom:1px solid var(--line);padding:calc(7px + env(safe-area-inset-top)) 16px 7px}.topin{max-width:820px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:10px}.logo{height:43px;max-width:190px;object-fit:contain}.status{font-size:11px;color:var(--mut);background:#f2f6f5;border:1px solid var(--line);border-radius:99px;padding:7px 9px}main{max-width:820px;margin:auto;padding:18px}.welcome{background:linear-gradient(135deg,var(--b),#24717e);color:white;border-radius:24px;padding:24px 22px;margin-bottom:18px;box-shadow:0 16px 34px rgba(24,79,95,.2);position:relative;overflow:hidden}.welcome:after{content:"";position:absolute;width:160px;height:160px;border-radius:50%;background:#ffffff12;right:-45px;top:-60px}.kicker{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:#cfe4e7}.welcome h1{font-size:29px;margin:6px 0 8px;letter-spacing:-.6px}.welcome p{margin:0;color:#dbeaec;line-height:1.45}.card,.person,.pack,.group{background:var(--card);border:1px solid var(--line);border-radius:17px;box-shadow:var(--shadow)}.card{padding:18px}.search{display:flex;align-items:center;gap:10px;background:white;border:1px solid var(--line);border-radius:16px;padding:0 14px;box-shadow:var(--shadow);margin-bottom:14px}.search input{border:0;outline:0;width:100%;padding:15px 0;background:transparent}.list{display:grid;gap:10px}.person{width:100%;text-align:left;padding:14px 15px;display:flex;align-items:center;justify-content:space-between}.pn{font-weight:780;color:var(--bd)}.pm{font-size:13px;color:var(--mut);margin-top:4px}.chev{font-size:23px;color:#78979d}.btn{border:0;border-radius:13px;padding:11px 15px;min-height:43px;font-weight:750}.primary{background:var(--b);color:white}.secondary{background:#e7f0ef;color:var(--bd)}.danger{background:#fff0f0;color:#9b2c2c;border:1px solid #f0cccc}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fffffffa;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);padding:8px 10px calc(8px + env(safe-area-inset-bottom))}.nav button{border:0;background:transparent;color:#71818b;border-radius:11px;padding:8px 4px;font-size:12px;font-weight:750}.nav button.active{background:#e7f0ef;color:var(--bd)}.nav i{display:block;font-style:normal;font-size:20px;margin-bottom:4px}.detailhead{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px}.back{width:44px;height:44px;border:0;border-radius:12px;background:#e7f0ef;color:var(--b);font-size:24px}.detailhead h2{margin:1px 0 3px;font-size:21px}.detailhead p{margin:0;color:var(--mut);font-size:13px}.pkgsel,.nameinput{width:100%;padding:13px;border:1px solid var(--line);border-radius:13px;background:white;margin-bottom:11px;color:var(--ink)}.rows{background:white;border:1px solid var(--line);border-radius:17px;overflow:hidden;box-shadow:var(--shadow)}.row{padding:13px 15px;border-bottom:1px solid #edf2f1}.row:last-child{border-bottom:0}.lab{font-size:12px;color:var(--mut);font-weight:760;margin-bottom:5px}.val{font-size:15px;line-height:1.4;overflow-wrap:anywhere}.empty{color:#95a1a8;font-style:italic}.pack{padding:16px 16px 16px 19px;margin-bottom:10px;border-left:4px solid var(--a)}.pack h3{margin:0 0 5px}.pack p{margin:0;color:var(--mut);font-size:13px}.group{margin-bottom:11px;overflow:hidden}.group summary{padding:14px 15px;font-weight:800;cursor:pointer;display:flex;justify-content:space-between}.check{display:flex;gap:10px;padding:10px 15px;border-top:1px solid #edf2f1}.check input{width:20px;height:20px;accent-color:var(--b2)}.check small{display:block;color:var(--mut)}.meta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.meta .card strong{font-size:22px;color:var(--b);display:block}.note{background:#edf6f5;border:1px solid #cfe3e0;border-radius:14px;padding:14px;color:#315a61;line-height:1.45}.foot{text-align:center;color:#829297;font-size:12px;padding:18px 0 4px}.hero-logo{width:100%;max-width:330px;display:block;margin:0 auto 16px}@media(min-width:700px){.nav{width:500px;left:50%;right:auto;transform:translateX(-50%);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0}}
</style></head>
<body><div id="app"></div><input id="file" type="file" accept=".xlsx" hidden>
<script>
const LOGO='./assets/logo-nakuna.jpg', FIX=[['J','Fecha de ingreso al servicio'],['FULL','Nombres y apellidos'],['M','Cédula'],['W','Fecha de nacimiento'],['X','Edad'],['Y','Discapacidad'],['BA','Parroquia'],['BB','Barrio o sector'],['BF','Referencia de ubicación'],['BI','Nombres y apellidos de representante'],['BJ','Cédula representante'],['BK','Celular representante']];
let state={view:'search',records:[],headers:[],query:'',person:null,pkg:'p1',editing:null,meta:null,packages:loadPkgs()};
const el=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
function col(i){let s='';for(i++;i;i=Math.floor((i-1)/26))s=String.fromCharCode(65+(i-1)%26)+s;return s}function ci(c){let n=0;for(const x of c)n=n*26+x.charCodeAt(0)-64;return n-1}
function loadPkgs(){try{return JSON.parse(localStorage.getItem('nakuna.pkgs'))||[{id:'p2',name:'Paquete 2',cols:[]}]}catch{return[{id:'p2',name:'Paquete 2',cols:[]}]}}function savePkgs(){localStorage.setItem('nakuna.pkgs',JSON.stringify(state.packages))}
function pkgs(){return[{id:'p1',name:'Paquete 1',fixed:true},...state.packages]}
function db(){return new Promise((r,j)=>{let q=indexedDB.open('NakunaUsuarios',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)})}async function put(v){let d=await db();return new Promise((r,j)=>{let t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,'matrix');t.oncomplete=r;t.onerror=()=>j(t.error)})}async function get(){let d=await db();return new Promise((r,j)=>{let q=d.transaction('kv').objectStore('kv').get('matrix');q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)})}async function del(){let d=await db();return new Promise(r=>{let t=d.transaction('kv','readwrite');t.objectStore('kv').delete('matrix');t.oncomplete=r})}
function nav(a){return `<nav class="nav"><button data-nav="search" class="${a==='search'?'active':''}"><i>⌕</i>Buscar</button><button data-nav="packages" class="${a==='packages'?'active':''}"><i>☷</i>Paquetes</button><button data-nav="data" class="${a==='data'?'active':''}"><i>▣</i>Datos</button></nav>`}
function shell(x,a=state.view){return `<div class="shell"><header class="top"><div class="topin"><img class="logo" src="${LOGO}" alt="Fundación Nakuna"><span class="status">${state.records.length?state.records.length+' usuarios':'Base local'}</span></div></header><main>${x}<div class="foot">Fundación Nakuna · re-evolución social</div></main>${nav(a)}</div>`}
function welcome(){return `<section class="welcome"><div class="kicker">Fundación Nakuna</div><h1>Hola, Juan Carlos</h1><p>Consulta y organiza la información de las personas usuarias de forma rápida y segura.</p></section>`}
function bind(){document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{state.view=b.dataset.nav;render()});document.querySelectorAll('[data-import]').forEach(b=>b.onclick=()=>el('#file').click());document.querySelectorAll('[data-person]').forEach(b=>b.onclick=()=>{state.person=b.dataset.person;state.pkg='p1';state.view='detail';render()})}
function render(){if(state.view==='detail')detail();else if(state.view==='packages')packages();else if(state.view==='edit')editor();else if(state.view==='data')dataView();else search()}
function search(){if(!state.records.length){el('#app').innerHTML=shell(`<div class="card"><img class="hero-logo" src="${LOGO}"><h2>Hola, Juan Carlos</h2><p style="color:var(--mut);line-height:1.5">Importa la matriz XLSX para comenzar. Los datos quedan guardados únicamente en este dispositivo.</p><div class="actions"><button class="btn primary" data-import>Importar Excel</button></div></div><div style="height:12px"></div><div class="note">La base no se publica en internet: solo la aplicación está alojada en la web.</div>`,'search');bind();return}let q=norm(state.query),rs=state.records.filter(r=>!q||norm(r.full+' '+r.doc).includes(q));el('#app').innerHTML=shell(`${welcome()}<div class="search"><span>⌕</span><input id="q" value="${esc(state.query)}" placeholder="Buscar nombre, apellido o cédula"></div><div class="list">${rs.map(r=>`<button class="person" data-person="${r.id}"><div><div class="pn">${esc(r.full||'Sin nombre')}</div><div class="pm">Cédula: ${esc(r.doc||'Sin dato')}</div></div><span class="chev">›</span></button>`).join('')||'<div class="card">No se encontraron resultados.</div>'}</div>`,'search');bind();let qin=el('#q');qin.oninput=e=>{state.query=e.target.value;search();let n=el('#q');n.focus();n.setSelectionRange(n.value.length,n.value.length)}}
function detail(){let r=state.records.find(x=>x.id===state.person);if(!r){state.view='search';return render()}let p=pkgs().find(x=>x.id===state.pkg)||pkgs()[0],rows=p.fixed?FIX.map(([c,l])=>[l,c==='FULL'?r.full:r.v[ci(c)]??'']):(p.cols||[]).map(i=>[state.headers[i]||`Columna ${col(i)}`,r.v[i]??'']);el('#app').innerHTML=shell(`<div class="detailhead"><button class="back" id="back">‹</button><div><h2>${esc(r.full)}</h2><p>${esc(r.doc?'Cédula: '+r.doc:'Sin cédula')}</p></div></div><select class="pkgsel" id="ps">${pkgs().map(x=>`<option value="${x.id}" ${x.id===p.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select><div class="rows">${rows.map(x=>`<div class="row"><div class="lab">${esc(x[0])}</div><div class="val ${x[1]?'':'empty'}">${esc(x[1]||'Sin dato')}</div></div>`).join('')||'<div class="row empty">Este paquete no tiene campos seleccionados.</div>'}</div>`,'search');bind();el('#back').onclick=()=>{state.view='search';render()};el('#ps').onchange=e=>{state.pkg=e.target.value;detail()}}
function packages(){el('#app').innerHTML=shell(`${welcome()}<div class="card"><h2 style="margin-top:0">Paquetes de datos</h2><p style="color:var(--mut)">Paquete 1 contiene los 12 datos principales. Crea paquetes personalizados con cualquier campo de la matriz.</p><div class="actions"><button class="btn primary" id="new">Crear paquete</button></div></div><div style="height:12px"></div>${pkgs().map(p=>`<div class="pack"><h3>${esc(p.name)}${p.fixed?' · fijo':''}</h3><p>${p.fixed?'12 datos principales':(p.cols||[]).length+' campos seleccionados'}</p>${p.fixed?'':`<div class="actions"><button class="btn secondary" data-edit="${p.id}">Editar checklist</button></div>`}</div>`).join('')}`,'packages');bind();el('#new').onclick=()=>{let n=state.packages.length+2,p={id:'p'+Date.now(),name:'Paquete '+n,cols:[]};state.packages.push(p);savePkgs();state.editing=p.id;state.view='edit';render()};document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{state.editing=b.dataset.edit;state.view='edit';render()})}
function editor(){let p=state.packages.find(x=>x.id===state.editing);if(!p){state.view='packages';return render()}let groups={};state.headers.forEach((h,i)=>{let k='Campos de la matriz';(groups[k]??=[]).push([i,h])});el('#app').innerHTML=shell(`<div class="detailhead"><button class="back" id="bp">‹</button><div><h2>Editar paquete</h2><p>${p.cols.length} campos seleccionados</p></div></div><input class="nameinput" id="pn" value="${esc(p.name)}"><div class="actions" style="margin:0 0 12px"><button class="btn secondary" id="all">Seleccionar todos</button><button class="btn secondary" id="none">Quitar todos</button></div>${Object.entries(groups).map(([g,fs])=>`<details class="group" open><summary><span>${g}</span><span>${p.cols.length}/${state.headers.length}</span></summary>${fs.map(([i,h])=>`<label class="check"><input type="checkbox" data-col="${i}" ${p.cols.includes(i)?'checked':''}><span>${esc(h)}<small>Columna ${col(i)}</small></span></label>`).join('')}</details>`).join('')}`,'packages');bind();el('#bp').onclick=()=>{state.view='packages';render()};el('#pn').onchange=e=>{if(e.target.value.trim())p.name=e.target.value.trim();savePkgs()};el('#all').onclick=()=>{p.cols=state.headers.map((_,i)=>i);savePkgs();editor()};el('#none').onclick=()=>{p.cols=[];savePkgs();editor()};document.querySelectorAll('[data-col]').forEach(c=>c.onchange=e=>{let i=+e.target.dataset.col,s=new Set(p.cols);e.target.checked?s.add(i):s.delete(i);p.cols=[...s].sort((a,b)=>a-b);savePkgs()})}
function dataView(){el('#app').innerHTML=shell(`${welcome()}<div class="card"><h2 style="margin-top:0">Base local</h2><p style="color:var(--mut)">Actualiza la matriz cuando tengas una nueva versión del Excel.</p><div class="actions"><button class="btn primary" data-import>${state.records.length?'Actualizar Excel':'Importar Excel'}</button>${state.records.length?'<button class="btn danger" id="clear">Eliminar datos locales</button>':''}</div></div><div class="meta"><div class="card"><strong>${state.records.length}</strong><span>usuarios</span></div><div class="card"><strong>${state.headers.length}</strong><span>campos</span></div></div>${state.meta?`<div style="height:12px"></div><div class="note">Archivo actual: <strong>${esc(state.meta.name)}</strong></div>`:''}`,'data');bind();if(el('#clear'))el('#clear').onclick=async()=>{if(confirm('¿Eliminar la matriz guardada en este dispositivo?')){await del();state.records=[];state.headers=[];state.meta=null;render()}}}
function makeHeaders(rows,n){let out=[];for(let c=0;c<n;c++){let vals=[];for(let r=0;r<11;r++){let x=String(rows[r]?.[c]??'').trim().replace(/\s+/g,' ');if(x&&!vals.includes(x))vals.push(x)}let h=vals.slice(-2).join(' · ')||`Columna ${col(c)}`;out.push(h)}return out}
function dateFmt(v){if(v instanceof Date&&!isNaN(v)){let d=String(v.getDate()).padStart(2,'0'),m=String(v.getMonth()+1).padStart(2,'0');return `${d}/${m}/${v.getFullYear()}`}return v==null?'':String(v)}
el('#file').onchange=async e=>{let f=e.target.files[0];e.target.value='';if(!f)return;try{let wb=XLSX.read(await f.arrayBuffer(),{type:'array',cellDates:true}),ws=wb.Sheets[wb.SheetNames[0]],rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:true}),n=Math.max(...rows.map(r=>r.length)),headers=makeHeaders(rows,n),records=[];for(let r=11;r<rows.length;r++){let a=rows[r]||[],v=Array.from({length:n},(_,i)=>dateFmt(a[i]));let first=v[ci('K')]||'',last=v[ci('L')]||'',doc=v[ci('M')]||'';if(!first&&!last&&!doc)continue;records.push({id:'r'+r,full:(first+' '+last).replace(/\s+/g,' ').trim(),doc:String(doc),v})}if(!records.length)throw Error('No encontré usuarios desde la fila 12. Verifica que sea la matriz esperada.');state.records=records;state.headers=headers;state.meta={name:f.name};let p2=state.packages.find(p=>p.id==='p2');if(p2&&p2.cols.length===0)p2.cols=headers.map((_,i)=>i);savePkgs();await put({records,headers,meta:state.meta});state.view='search';state.query='';render()}catch(err){alert('No pude importar el Excel: '+err.message)}};
(async()=>{try{let x=await get();if(x){state.records=x.records||[];state.headers=x.headers||[];state.meta=x.meta||null}}catch{}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{})})();
</script></body></html>
